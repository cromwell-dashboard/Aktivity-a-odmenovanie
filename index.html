@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600;700&display=swap');

.app {
  --blue: #3A52C9;
  --blue-dark: #2B3DA0;
  --blue-light: #8A98DF;
  --blue-soft: #E8EAFA;
  --ink: #33363F;
  --ink-soft: #6B6E78;
  --paper: #F3F4F6;
  --surface: #FFFFFF;
  --line: #E2E3E8;
  --green: #3F9C6D;
  --green-soft: #E5F4ED;
  --amber: #D98C3A;
  --amber-soft: #FBEEDD;
  --red: #D1493C;
  --red-soft: #FBE7E4;
  --navy-soft: #E8EAFA;
  --slate: #8A8D97;
  --slate-soft: #EEEFF2;
  --shadow: 0 1px 2px rgba(40,48,80,0.05), 0 6px 18px rgba(40,48,80,0.06);
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  padding: 22px;
  box-sizing: border-box;
}
.app * { box-sizing: border-box; }
.app table { font-family: 'Inter', system-ui, sans-serif; }
.mono, .input-cell.mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; }

.loader-screen {
  display: flex; align-items: center; justify-content: center;
  height: 60vh; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 18px; color: var(--ink-soft);
}

/* ---- header ---- */
.topbar {
  position: sticky; top: 0; z-index: 50;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  background: var(--paper); padding: 8px 22px;
  margin: -22px -22px 16px -22px;
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 8px rgba(40,48,80,0.06);
}
.topbar-month-filter {
  display: flex; align-items: center; gap: 8px;
  flex: 1; justify-content: flex-end; min-width: 0; overflow: hidden;
}
.brand { display: flex; align-items: center; gap: 14px; }
.brand-logo { height: 34px; width: auto; display: block; }
.brand-divider { width: 1px; height: 30px; background: var(--line); }
.brand-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; color: var(--ink); }
.brand-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }

.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 4px; align-items: center; }
.tabs-spacer { flex: 1; }
.tab-subtle { font-size: 12px; padding: 6px 11px; color: var(--slate); opacity: 0.7; }
.tab-subtle:hover { opacity: 1; }
.tab-subtle.tab-active { opacity: 1; background: #EFEAF8; color: #6D4AAE; }
.tab-plan { color: #1F3864; }
.tab-plan.tab-active { background: #1F3864; color: #fff; }
.pl-live { --navy:#1F3864; --pblue:#2E75B6; --pmut:#647080; --pline:#e3e9f1; --pg:#1E7B34; --pr:#C0392B; }
.pl-sec { background:#fff; border:1px solid var(--pline); border-top:4px solid var(--navy); border-radius:14px; box-shadow:0 1px 2px rgba(16,38,73,.05),0 4px 14px rgba(16,38,73,.05); padding:20px 24px 24px; margin-bottom:24px; }
.pl-shead { display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:6px; padding-bottom:13px; border-bottom:2px solid var(--pline); }
.pl-stitle { display:flex; align-items:center; gap:10px; }
.pl-sn { width:30px; height:30px; border-radius:8px; background:var(--navy); color:#fff; font-size:14px; font-weight:700; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(31,56,100,.3); }
.pl-stitle h2 { font-size:17px; color:var(--navy); font-family:'Poppins',sans-serif; }
.pl-ssub { font-size:12.5px; color:var(--pmut); margin:13px 0 16px; line-height:1.5; }
.pl-ctl { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
.pl-seg { display:inline-flex; background:#e9eef5; border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap; }
.pl-seg button { font:inherit; font-size:13px; font-weight:600; padding:7px 14px; cursor:pointer; border:none; background:transparent; color:var(--pmut); border-radius:8px; }
.pl-seg button.on { background:#fff; color:var(--navy); box-shadow:0 1px 3px rgba(16,38,73,.15); }
.pl-seg-wrap button { padding:6px 11px; font-size:12px; }
.pl-select { font:inherit; font-size:13px; font-weight:600; padding:7px 12px; border:1px solid var(--pline); border-radius:9px; background:#fff; color:var(--navy); cursor:pointer; }
.pl-range { display:inline-flex; align-items:center; gap:4px; }
.pl-mut { color:var(--pmut); }
.pl-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:14px 0 18px; }
.pl-kpi { background:#f8fafd; border:1px solid var(--pline); border-radius:12px; padding:13px 15px; }
.pl-kpi .l { font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--pmut); }
.pl-kpi .v { font-size:20px; font-weight:700; color:var(--navy); margin-top:5px; font-variant-numeric:tabular-nums; }
.pl-g { color:var(--pg) !important; } .pl-b { color:var(--pblue) !important; } .pl-r { color:var(--pr) !important; }
.pl-bg-g { background:var(--pg); } .pl-bg-b { background:var(--pblue); } .pl-bg-r { background:var(--pr); }
.pl-grid { display:grid; grid-template-columns:1.15fr 1fr; gap:22px; align-items:start; }
.pl-chh { font-size:13px; font-weight:700; color:var(--navy); margin-bottom:12px; }
.pl-hbars { display:flex; flex-direction:column; gap:10px; }
.pl-hbar-row { display:grid; grid-template-columns:130px 1fr 52px; align-items:center; gap:10px; }
.pl-hbar-lbl { min-width:0; }
.pl-hbar-track { position:relative; height:16px; background:#eef2f7; border-radius:5px; overflow:visible; }
.pl-hbar-fill { height:100%; border-radius:5px; min-width:2px; }
.pl-hbar-100 { position:absolute; left:66.6%; top:-3px; bottom:-3px; width:2px; background:var(--pr); opacity:.55; }
.pl-hbar-val { text-align:right; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums; }
.pl-tbl { width:100%; font-size:12.5px; border-collapse:collapse; }
.pl-tbl th { background:var(--navy); color:#fff; font-weight:700; padding:8px 10px; text-align:left; font-size:11.5px; }
.pl-tbl th.num, .pl-tbl td.num { text-align:right; font-variant-numeric:tabular-nums; }
.pl-tbl td { padding:7px 10px; border-bottom:1px solid var(--pline); }
.pl-tbl tbody tr:nth-child(even) td { background:#f8fafd; }
.pl-tot td { font-weight:700; background:#eaf0f8 !important; border-top:2px solid var(--navy); }
.pl-legend { display:flex; gap:16px; font-size:12px; color:var(--pmut); margin-bottom:8px; align-items:center; }
.pl-sw { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:5px; vertical-align:middle; }
.pl-chartbox { width:100%; }
.pl-svg { width:100%; height:auto; display:block; }
.pl-tblwrap { overflow-x:auto; }
.pl-manual th { text-align:center; }
.pl-inp { width:88px; padding:5px 7px; border:1px solid var(--pline); border-radius:6px; font-family:inherit; font-size:12px; text-align:right; }
.pl-kpis6 { display:grid; grid-template-columns:1.4fr repeat(4,1fr); gap:12px; margin:14px 0 18px; }
.pl-kpi-hdr { background:transparent; border-color:transparent; display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:0 10px; }
.pl-kpi2h { font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--navy); text-align:right; flex:1; }
.pl-kpi .v { font-size:16px; }
.pl-kpi .l { font-size:10px; }
.pl-2charts { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:10px; }
.pl-subhdr th { background:#2E75B6 !important; font-size:10.5px !important; }
.pl-tbl td.strong, .pl-tbl td.num.strong { font-weight:700; }
@media (max-width:900px){ .pl-kpis6 { grid-template-columns:1fr 1fr; } .pl-2charts { grid-template-columns:1fr; } }
.tab {
  border: none; background: transparent; padding: 8px 16px; border-radius: 8px;
  font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer;
  transition: all 0.15s ease; font-family: inherit;
}
.tab:hover { background: var(--paper); }
.tab-active { background: var(--blue); color: #fff; }
.tab-weekly { color: #1F7A54; }
.tab-weekly.tab-active { background: #1F7A54; color: #fff; }
.tab-tracker { color: #6D4AAE; }
.tab-tracker.tab-active { background: #6D4AAE; color: #fff; }
.trk-panel { --trk: #6D4AAE; --trk-soft: #EFEAF8; }
.trk-head { display: flex; flex-direction: column; gap: 12px; background: var(--trk-soft); border: 1px solid #d8cdf0; border-left: 4px solid var(--trk); border-radius: 12px; padding: 14px 18px; }
.trk-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 20px; color: var(--trk); }
.trk-sub { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.trk-kpi { margin-top: 4px; }
.trk-legend { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-soft); margin: 14px 0 6px; }
.trk-lg { display: inline-flex; align-items: center; gap: 5px; }
.trk-cell.mini { width: 14px; height: 14px; border-radius: 3px; }
.trk-svcf { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.trk-list { display: flex; flex-direction: column; gap: 10px; }
.trk-deal { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.trk-deal.trk-miss { border-color: var(--amber); box-shadow: 0 0 0 1px var(--amber) inset; }
.trk-deal-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.trk-deal-cli { display: inline-flex; align-items: center; gap: 8px; }
.trk-cli-name { font-weight: 700; font-size: 14px; color: var(--ink); }
.trk-flag { color: var(--amber); font-size: 16px; }

  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px;
  background: color-mix(in srgb, var(--svc-color) 14%, white);
  color: var(--svc-color); white-space: nowrap;
}
/* Adresn\xE9 / Neadresn\xE9 doru\u010Dovanie \u2014 zalomi\u0165 v st\u013Apci detail tabu\u013Eky */
td .svc-tag { white-space: normal; word-break: break-word; max-width: 130px; }

/* ---- badges ---- */
.badge { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.badge-green { background: var(--green-soft); color: var(--green); }
.badge-amber { background: var(--amber-soft); color: var(--amber); }
.badge-navy { background: var(--blue-soft); color: var(--blue); }
.badge-slate { background: var(--slate-soft); color: var(--slate); }
.badge-red { background: var(--red-soft); color: var(--red); }

/* ---- deal cards / New Business ---- */
.deal-grid { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.deal-grid .deal-card { flex: 0 0 auto; min-width: 240px; }
.deal-card {
  border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  background: var(--paper); display: flex; flex-direction: column; gap: 8px;
}
.deal-card-highlight {
  border-color: var(--red) !important;
  box-shadow: 0 0 0 2px rgba(220,53,69,0.25);
  animation: highlight-fade 4s ease forwards;
}
@keyframes highlight-fade {
  0% { border-color: var(--red); box-shadow: 0 0 0 2px rgba(220,53,69,0.25); }
  80% { border-color: var(--red); box-shadow: 0 0 0 2px rgba(220,53,69,0.1); }
  100% { border-color: var(--line); box-shadow: none; }
}
.deal-month-rows { margin-top: 4px; border-top: 1px dashed var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 2px; }
.deal-month-row { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 36px; gap: 4px; align-items: center; padding: 3px 4px; border-radius: 4px; font-size: 12px; }
.deal-month-header-row { opacity: 0.7; }
.deal-month-row:not(.deal-month-header-row):hover { background: var(--blue-soft); }
.deal-month-name { color: var(--slate); white-space: nowrap; }
.deal-month-detail { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 10px; margin: 1px 0 2px; padding-left: 2px; }
.dm-mat { font-size: 11px; font-weight: 600; color: var(--blue-dark); }
.dm-mrs { font-size: 11px; font-style: italic; color: var(--slate); }
.mrs-popis-box { margin: 6px 0; padding: 6px 8px; background: var(--red-soft); border-radius: 6px; }
.mrs-popis-title { font-size: 10.5px; font-weight: 700; color: var(--red); text-transform: uppercase; letter-spacing: .03em; margin-bottom: 3px; }
.mrs-popis-line { display: flex; gap: 8px; font-size: 12px; line-height: 1.4; }
.mrs-popis-svc { font-weight: 700; color: var(--ink); min-width: 54px; }
.mrs-popis-txt { color: var(--slate); }
.deal-month-trzba { color: var(--ink); text-align: right; white-space: nowrap; }
.deal-month-marza { color: var(--ink-soft); text-align: right; white-space: nowrap; }
.deal-month-odmena { color: var(--green); font-weight: 600; text-align: right; white-space: nowrap; }
.deal-month-expired .deal-month-odmena { color: var(--slate); }
.deal-month-empty .deal-month-trzba { color: var(--amber); }
.deal-month-placeholder { opacity: 0.45; }
.deal-month-placeholder .deal-month-name { color: var(--slate); font-style: italic; }
.deal-month-actions { display: flex; gap: 1px; justify-content: flex-end; opacity: 0; }
.deal-month-row:hover .deal-month-actions { opacity: 1; }
.deal-month-approve { color: var(--slate); padding: 2px; }
.deal-month-approve:hover { color: var(--green); background: var(--green-soft); }
.deal-month-approve-active { color: var(--green) !important; opacity: 1 !important; }
.deal-month-del { color: var(--slate); padding: 2px; }
.deal-month-total { border-top: 1px solid var(--line); margin-top: 2px; padding-top: 5px; }
.deal-month-total .deal-month-name { font-weight: 700; color: var(--ink); }
.deal-month-total .deal-month-trzba { font-weight: 700; }
.deal-month-total .deal-month-odmena { color: var(--blue-dark); }
.nb-empty-dot { color: var(--amber); font-size: 10px; margin-left: 3px; }
.nb-approved-dot { color: var(--green); font-size: 10px; margin-left: 3px; }
.platnost-edit-btn {
  border: none; background: none; padding: 0; margin-top: -4px;
  font-size: 10.5px; color: var(--slate); cursor: pointer; display: flex;
  align-items: center; gap: 3px; font-family: inherit;
}
.platnost-edit-btn:hover { color: var(--blue); }
.platnost-edit-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.platnost-edit-label { font-size: 11px; color: var(--slate); white-space: nowrap; }
.star-btn { border: none; background: none; padding: 2px; cursor: pointer; color: var(--slate); display: inline-flex; align-items: center; border-radius: 4px; }
.star-btn:hover { color: var(--amber); }

.star-filter-btn { display: flex; align-items: center; gap: 5px; }
.star-filter-active { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber); }
.mrs-filter-active { background: var(--red); color: #fff; border-color: var(--red); }
.month-cell { display: flex; flex-direction: column; line-height: 1.2; }

.deal-card-top { display: flex; align-items: center; justify-content: space-between; }
.deal-card-top-right { display: flex; align-items: center; gap: 6px; }
.month-count-badge {

}

.nb-klient-cell { display: flex; flex-direction: column; gap: 1px; }

.obchodnik-block { margin-bottom: 22px; }

}

.obchodnik-header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.obchodnik-total { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 15px; color: var(--green); }
.obchodnik-month-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.month-pill {

}

.obchodnik-total .dim { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; margin-left: 4px; }

.route { margin: 4px 0 2px; }
.route-track { position: relative; height: 6px; border-radius: 3px; background: var(--line); }
.route-fill { position: absolute; left: 0; top: 0; height: 100%; border-radius: 3px; transition: width 0.3s ease; }
.route-meta { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--slate); margin-top: 5px; }
.route-end.expired { color: var(--red); font-weight: 600; }
.route-label { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }

/* ---- modal ---- */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(40,48,80,0.45);
  display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50;
}
.modal {
  background: var(--surface); border-radius: 14px; max-width: 640px; width: 100%;
  max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.25);
}
.modal-wide { max-width: 820px; }
.modal-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: 18px 20px; border-bottom: 1px solid var(--line);
}
.modal-title { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 17px; }
.modal-sub { font-size: 12.5px; color: var(--slate); margin-top: 2px; }
.modal-body { padding: 18px 20px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-grid-3 { grid-template-columns: 1fr 1fr 1fr; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-size: 11.5px; font-weight: 600; color: var(--ink-soft); }
.field .input, .field .select { width: 100%; }
.close-services-list { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
.close-svc-block { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; background: var(--paper); }
.close-svc-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.close-svc-odmena { font-size: 12px; color: var(--blue); font-weight: 600; }
.close-svc-info { font-size: 11.5px; color: var(--slate); margin-top: 8px; }
.preview-box {
  margin-top: 16px; background: var(--blue-soft); border: 1px solid var(--blue-light);
  border-radius: 10px; padding: 12px 14px; font-size: 13px; color: var(--ink); line-height: 1.6;
}
.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px;
  border-top: 1px solid var(--line);
}
.poznamka-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
.poznamka-input { flex: 1; min-width: 200px; }

/* ---- toast ---- */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--blue); color: #fff; padding: 11px 18px; border-radius: 10px;
  font-size: 13px; display: flex; align-items: center; gap: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.25); z-index: 60; max-width: 90vw;
}
/* ---- legendy pre vlastn\xE9 SVG grafy ---- */
.chart-legend { display: flex; flex-direction: column; gap: 6px; }
.chart-legend-row { flex-direction: row; flex-wrap: wrap; gap: 14px; margin-top: 10px; justify-content: center; }
.legend-row { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-soft); }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; }
.legend-name { font-weight: 600; color: var(--ink); }
.legend-val { color: var(--slate); }
.donut-row { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.donut-row svg { flex: none; max-width: 220px; }
.hbar-wrap { display: flex; flex-direction: column; gap: 9px; margin-top: 6px; }
.hbar-row { display: grid; grid-template-columns: 150px 1fr auto; align-items: center; gap: 10px; }
.hbar-label { font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { height: 18px; background: var(--paper); border-radius: 6px; overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 6px; transition: width 0.3s ease; min-width: 2px; }
.hbar-val { display: flex; align-items: baseline; gap: 6px; justify-content: flex-end; min-width: 64px; }
.hbar-count { font-size: 13px; font-weight: 700; color: var(--ink); }
.hbar-pct { font-size: 11px; color: var(--slate); min-width: 30px; text-align: right; }
.hbar-empty { font-size: 12px; color: var(--slate); padding: 16px 0; text-align: center; }

/* ---- prihlasovanie / nastavenie / schva\u013Eovanie ---- */
.header-logout { margin-left: 8px; }
.login-wrap { min-height: 90vh; display: flex; align-items: center; justify-content: center; }
.login-box {
  background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
  padding: 32px 30px; width: 100%; max-width: 380px; box-shadow: var(--shadow);
  display: flex; flex-direction: column; gap: 14px; align-items: stretch;
}
.login-box .brand-logo { width: 160px; height: auto; margin-bottom: 4px; align-self: flex-start; flex: none; }
.login-title { font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 17px; color: var(--ink); }
.setup-text { font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
.login-error {
  display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--red);
  background: var(--red-soft); border-radius: 8px; padding: 8px 10px;
}
.login-submit { width: 100%; justify-content: center; margin-top: 4px; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #B03B30; }

.approve-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.approve-card {
  border: 1px solid var(--line); border-radius: 12px; padding: 14px;
  background: var(--paper); display: flex; flex-direction: column; gap: 10px;
}
.approve-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.approve-meta > div { display: flex; flex-direction: column; font-size: 11px; color: var(--slate); }
.approve-meta strong { font-size: 13px; color: var(--ink); }
.approve-actions { display: flex; gap: 8px; justify-content: flex-end; }
.approve-reject-box { display: flex; flex-direction: column; gap: 8px; }
.approve-textarea { width: 100%; min-height: 56px; resize: vertical; font-family: inherit; }
.approve-note { font-size: 11px; margin-top: 3px; font-style: italic; }

/* ===== MOBILN\u00c1 VERZIA ===== */
@media (max-width: 640px) {
  .app { zoom: 1 !important; padding: 0 !important; font-size: 15px; }
  .topbar { flex-direction: column; align-items: stretch; gap: 8px; padding: 10px 12px; border-radius: 0; }
  .brand { justify-content: flex-start; }
  .brand-logo { max-height: 30px; }
  .brand-title { font-size: 16px; }
  .brand-sub { font-size: 11px; }
  .brand-divider { display: none; }
  .header-logout { align-self: flex-end; margin-top: -34px; }
  .tabs { overflow-x: auto; scrollbar-width: none; flex-wrap: nowrap; border-radius: 0; border-left: none; border-right: none; padding: 4px 8px; gap: 2px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { white-space: nowrap; flex-shrink: 0; font-size: 13px; padding: 8px 12px; }
  .tabs-spacer { display: none; }
  .main { gap: 12px; padding: 10px; }
  .tab-panel { gap: 12px; }
  .card { padding: 12px; border-radius: 12px; }
  .month-bar-row { padding: 8px 10px; margin: 0 0 4px; }
  .grid-kpi { grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi-card { padding: 11px 12px; }
  .kpi-value { font-size: 19px; }
  .kpi-label { font-size: 10px; }
  .grid-2 { grid-template-columns: 1fr; gap: 12px; }
  .nb-sticky-kpi { position: static; }

  /* Tabu\u013eky: horizont\u00e1lny scroll s jemn\u00fdm okrajom */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 10px; }
  .table-wrap table { min-width: 720px; }
  table { font-size: 12px; }
  th, td { padding: 6px 8px; }

  /* Filtre stackovan\u00e9 */
  .filters-row { flex-direction: column; align-items: stretch; gap: 8px; }
  .filter-field { width: 100%; }
  .filters-spacer { display: none; }
  .filter-field-btn { width: 100%; }
  .filter-field-btn .btn { width: 100%; justify-content: center; }
  .search-wrap { width: 100%; }

  /* Modal cel\u00e1 \u0161\u00edrka */
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal, .modal-wide { max-width: 100%; width: 100%; max-height: 94vh; border-radius: 16px 16px 0 0; }
  .form-grid { grid-template-columns: 1fr 1fr; }
  .form-grid-3 { grid-template-columns: 1fr; }
  .modal-footer { flex-direction: column-reverse; gap: 8px; }
  .modal-footer .btn { width: 100%; justify-content: center; }

  /* Export bar */
  .export-bar { flex-direction: column; align-items: stretch; gap: 10px; }
  .export-bar-ctl { flex-wrap: wrap; }

  /* Pl\u00e1n a vyhodnotenie */
  .pl-sec { padding: 14px 14px 16px; }
  .pl-shead { flex-direction: column; align-items: flex-start; gap: 10px; }
  .pl-ctl { width: 100%; }
  .pl-select { flex: 1; }
  .pl-kpis6 { grid-template-columns: 1fr; gap: 8px; }
  .pl-kpi-hdr { display: none; }
  .pl-kpi { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 8px; }
  .pl-kpi .l { grid-column: 1; }
  .pl-2charts { grid-template-columns: 1fr; }
  .pl-seg-wrap { overflow-x: auto; flex-wrap: nowrap; scrollbar-width: none; max-width: 100%; }

  /* T\u00fd\u017edenn\u00fd preh\u013ead */
  .wk-grid, .wk-layout { grid-template-columns: 1fr !important; }
  .wk-side { width: 100%; }
  .wk-act-row { grid-template-columns: 60px 1fr 16px; }
  .wk-act-obs { display: none; }
  .preh-act-row { grid-template-columns: 66px 1fr auto; }
  .preh-act-obs { display: none; }
  .preh-act-osl { display: none; }
  .preh-act-row .badge:not(:last-of-type) { display: none; }
  .obch-cards { grid-template-columns: 1fr; gap: 8px; }
  .nb-bar { flex-direction: column; align-items: flex-start; gap: 8px; }
  .nb-bar-vals { margin-left: 0; }
  .nb-bars-preh { grid-template-columns: 1fr; }
  .obch-card { padding: 11px; }
  .obch-total { font-size: 22px; }
  .obch-row { grid-template-columns: 1fr; padding: 4px 0; }
  .obch-blk { padding: 7px 14px; border-left: none; border-top: 1px solid var(--line); }
  .obch-blk-name { border-top: none; }
  .obch-row-chev { display: none; }
  .obch-act-row { grid-template-columns: 64px 1fr auto 14px; }
  .oa-osl { display: none; }
  .obch-act-row .badge:not(:last-of-type) { display: none; }

  /* New Business detail tabu\u013eka - necha\u0165 scrollova\u0165 */
  .obchodnik-block-header { flex-direction: column; align-items: flex-start; gap: 6px; }
  .deal-grid { grid-template-columns: 1fr !important; }

  /* Sledova\u010d */
  .trk-grid { grid-template-columns: 1fr !important; }

  /* Toast */
  .toast { left: 12px; right: 12px; bottom: 12px; width: auto; }
}
@media (max-width: 400px) {
  .grid-kpi { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .brand-title { font-size: 15px; }

#nbpr tbody tr.total td{border-bottom:0;font-weight:800}
#nbpr tbody tr.total-first td{border-top:2px solid var(--primary);padding-top:13px}
#nbpr tbody tr.total td.segname{border-left:2px solid var(--primary);border-top:2px solid var(--primary);border-bottom:2px solid var(--primary)}
#nbpr tbody tr.total td:last-child{border-right:2px solid var(--primary)}
#nbpr tbody tr.total.group-end td{border-bottom:2px solid var(--primary)}
#nbpr tbody td.segname{vertical-align:top;font-weight:800;padding-top:12px}
#nbpr tbody td.metric{text-align:left;color:var(--muted);font-weight:600}
#nbpr tbody tr.metric-row td{padding:9px 14px;border-bottom-color:#f1f2f5}
#nbpr tbody tr.group-end td{border-bottom-color:var(--line)}
#nbpr #nbpr .filters{display:none!important}
.nn-inline{font-weight:400;font-size:11px;color:#5b647a;margin-left:4px;cursor:pointer}
.nn-inline input{vertical-align:middle;margin-right:2px}
.zb-cell{display:flex;flex-direction:column;line-height:1.2}
.zb-base{font-size:11.5px;font-weight:600;color:var(--ink)}
.zb-rate{font-size:10.5px;color:var(--slate)}
.tnm-mp .tnm-mp-val{font-size:11px;font-weight:700;color:var(--slate)}
.nn-ico{margin-left:5px;width:18px;height:18px;border-radius:5px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:11px;line-height:1;padding:0}
.nn-ico-on{color:var(--green);border-color:#cfe8db}
.nn-ico-off{color:#d64545;border-color:#f0cfcf;background:#fdf3f3}
.nn-ico:disabled{cursor:default;opacity:.75}
.nn-ico:not(:disabled):hover{filter:brightness(.96)}
.row-exp-ico{margin-right:6px;width:16px;height:16px;padding:0;border:1px solid var(--line);background:#fff;border-radius:4px;color:var(--slate);font-size:9px;line-height:1;cursor:pointer;vertical-align:1px}
.row-exp-ico:hover{background:#eef1fb;color:var(--blue-dark)}
.col-obch{white-space:nowrap}
.obch-ini{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 5px;border-radius:6px;background:var(--paper);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink);cursor:pointer}
.obch-ini:hover{background:#eef1fb}
.obch-ini2{margin-left:4px;font-weight:600;color:var(--slate)}
.tnm-ks{display:inline-flex;align-items:center;gap:2px}
.tnm-input-ks{width:76px;text-align:right}
.tnm-ks-ed{cursor:pointer;border-bottom:1px dashed #c3cdee}
.tnm-ks-ed:hover{color:#001C9C;border-bottom-color:#001C9C}
.tnm-ks-add{font-weight:600;font-style:italic;color:#8891a5;border-bottom-style:none}
.tnm-ks-add:hover{color:#001C9C}
.tnm-ks-unit{font-size:11px;color:#8891a5;margin-left:3px}
.tnm-nn{display:inline-flex;align-items:center;gap:2px;font-size:10px;color:#8891a5;margin-left:6px;cursor:pointer;white-space:nowrap}
.tnm-nn input{margin:0}
.filter-input{font-size:12px;padding:6px 9px;border:1px solid #e6e9f2;border-radius:8px;min-width:140px;color:#1a2233;background:#fff}
.filter-input:focus{outline:none;border-color:#001C9C}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:10px 14px;background:#fff;border:1px solid #e6e9f2;border-radius:14px;margin-bottom:14px}
.fbar-hidden{display:none}
html{scroll-behavior:auto}
:root{--stk-h:0px}
.main > .card,.main > .tab-panel > .card,.main > .tab-panel > .grid-kpi,.main > .fbar,#nbpr .card,.perf-card,.main > .tab-panel > .mk-btns{scroll-margin-top:calc(var(--stk-h) + 14px)}
.stk{position:fixed;top:0;left:0;right:0;z-index:60;background:rgba(255,255,255,.97);backdrop-filter:saturate(140%) blur(6px);border-bottom:1px solid #e6e9f2;box-shadow:0 2px 10px rgba(30,40,80,.06);height:46px;animation:stkIn .16s ease}
@keyframes stkIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.stk-in{display:flex;align-items:center;gap:8px;height:100%;padding:0 18px;max-width:100%;overflow:visible}
.stk-logo{height:22px;width:auto;display:block;margin-right:4px}
.stk-sp{flex:1}
.stk-f{position:relative}
.stk-pill{display:inline-flex;align-items:center;gap:6px;background:#f4f6fb;border:1px solid #d7dbe6;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;color:#3a4256;cursor:pointer;font-family:inherit;white-space:nowrap}
.stk-pill:hover{background:#e9edfa;border-color:#b9c3e0}
.stk-pill.on{color:#001C9C;border-color:#b9c3e0}
.stk-back{position:fixed;inset:0;z-index:61}
.stk-pop{position:absolute;top:calc(100% + 8px);left:0;z-index:62;background:#fff;border:1px solid #d7dbe6;border-radius:12px;box-shadow:0 12px 30px rgba(30,40,80,.16);padding:12px;width:340px}
.stk-pop-h{font-size:10px;font-weight:800;letter-spacing:.07em;color:#98a1b5;text-transform:uppercase;margin-bottom:8px}
.stk .btn{white-space:nowrap}
.stk-lbl{margin-left:2px}
.hi{flex:0 0 auto;vertical-align:-2px}
.btn .hi,.export-corner-lbl .hi{margin-right:4px;color:currentColor;opacity:.75}
.topbar-under{opacity:0;pointer-events:none}
@media (max-width:1000px){.stk-lbl{display:none}}
.topbar{transition:padding .18s ease}
.topbar-mini{padding-top:5px;padding-bottom:5px;box-shadow:0 2px 10px rgba(30,40,80,.07)}
.topbar-mini .hdr-sum{display:inline-flex}
.hdr-clear{display:none}
.topbar-mini .hdr-clear{display:inline-flex;margin-left:8px}
.topbar-mini{flex-wrap:nowrap;overflow:hidden}
.topbar-mini .header-export{display:none}
.topbar-mini .tabs{padding:2px}
.topbar-mini .tab{font-size:12px;padding:5px 10px}
.topbar-mini .brand-title{white-space:nowrap}

.topbar-mini .brand-sub,.topbar-mini .brand-divider{display:none}
.topbar-mini .brand-logo{height:26px}
.topbar-mini .brand-eur svg{width:26px;height:26px}
.topbar-mini .brand-title{font-size:15px}

.fbar-grp{display:flex;flex-direction:column;gap:4px}
.fbar-grp-months{flex:1 1 300px;min-width:260px}
.fbar-lbl{font-size:9.5px;font-weight:800;letter-spacing:.09em;color:#98a1b5;text-transform:uppercase}
.fbar-year{font-weight:700;font-size:13px;color:#001C9C;background:#f4f6fb;border:1px solid #d7dbe6;border-radius:999px;padding:5px 13px;display:inline-block}
.fbar-seg{font-size:13px;font-weight:600;border:1px solid #e6e9f2;border-radius:9px;padding:7px 12px;background:#fff;cursor:pointer;color:#1a2233;min-width:150px}
.fbar .chip-row{display:flex;flex-wrap:wrap;gap:6px}
.fbar-clear{margin-left:auto;align-self:center;background:none;border:none;color:#5b647a;font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;padding:4px 2px}
.fbar-clear:hover{color:#001C9C}
.chip{display:inline-block;min-width:52px;text-align:center;font-weight:800;font-size:12.5px;padding:4px 9px;border-radius:7px}
#nbpr .chip.up{background:var(--pos-bg);color:var(--pos)}
#nbpr .chip.down{background:var(--neg-bg);color:var(--neg)}
#nbpr .chip.na{background:var(--panel);color:var(--muted-2)}
#nbpr td .plan-c{color:var(--muted)}
#nbpr tbody td.segname.expandable{cursor:pointer;user-select:none}
#nbpr .chev{display:inline-block;transition:transform .15s;font-size:10px;color:var(--muted);margin-right:3px}
#nbpr .chev.open{transform:rotate(90deg)}
#nbpr tbody td.partname{vertical-align:top;text-align:left;font-weight:600;color:var(--ink-2);padding-left:30px}
#nbpr tbody tr.subrow td{background:#fbfcfd;padding:8px 14px;border-bottom-color:#f1f2f5}
#nbpr tbody tr.subrow:hover td{background:#f3f6fb}
#nbpr tbody tr.subrow.group-end td{border-bottom-color:var(--line)}
#nbpr .mpct{font-size:11px;font-weight:700;color:var(--primary);margin-left:5px}
#nbpr tbody tr.exp-parent td.segname{border-left:2px solid var(--primary);border-top:2px solid var(--primary);border-bottom:2px solid var(--primary)}
#nbpr tbody tr.exp-first td{border-top:2px solid var(--primary)}
#nbpr tbody tr.exp-last td{border-bottom:2px solid var(--primary)}
#nbpr tbody tr.exp-parent td:last-child{border-right:2px solid var(--primary)}
#nbpr .grid.graphs{grid-template-columns:repeat(2,1fr)}
#nbpr .zp-mar-note{font-style:italic;color:var(--muted,#6b7280);font-size:12px}
#nbpr .graph .ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:14px}
#nbpr .graph .ghead h2{margin-bottom:2px}
#nbpr .graph .gsub{margin-bottom:0}
#nbpr .graphs-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
#nbpr .graphs-bar-label{font-size:13px;font-weight:800;letter-spacing:-.01em;color:var(--ink)}
#nbpr .graph .legend{margin-top:14px}
#nbpr .actrow{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
#nbpr .barmini{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:8px}
#nbpr .barmini .b{flex:1;background:var(--green);border-radius:4px 4px 0 0;position:relative;min-height:3px;transition:height .4s}
#nbpr .barmini .b.sel{background:var(--ink)}
#nbpr .barmini .b span{position:absolute;top:-16px;left:0;right:0;text-align:center;font-size:9.5px;font-weight:700;color:var(--muted)}
#nbpr .barmini .b em{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:9px;color:var(--muted-2);font-style:normal}
#nbpr .factlist{display:flex;flex-direction:column;gap:11px;font-size:12.5px}
#nbpr .fact{display:flex;gap:9px;align-items:flex-start}
#nbpr .fact .dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-top:5px;flex:none}
#nbpr .fact b{font-weight:700}
#nbpr .foot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted-2);
  border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
#nbpr .foot code{background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11px;color:var(--muted)}
#nbpr tbody tr.m-rev:not(.total) td:not(.segname):not(.partname){background:#eaf1fb}
#nbpr tbody tr.m-rev td.metric{color:#2b52c9;font-weight:700}
#nbpr tbody tr.m-mar:not(.total) td:not(.segname):not(.partname){background:#e9f6ed}
#nbpr tbody tr.m-mar td.metric{color:#1f8f5a;font-weight:700}
@media (max-width:900px){
  #nbpr .grid{grid-template-columns:1fr}
  #nbpr .grid.graphs{grid-template-columns:1fr}
  #nbpr .kpi-grid{grid-template-columns:repeat(2,1fr)}
  #nbpr .mg-grid{grid-template-columns:1fr}
  #nbpr .gbars{grid-template-columns:1fr}
  #nbpr .gbars-head{grid-template-columns:1fr}
  #nbpr .actrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){#nbpr *{transition:none!important}}
#nbpr :focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
